services:
  - type: web
    name: synergy-prototype-api
    runtime: node
    # Free plan: no card needed, but no persistent disk (accounts and uploads
    # reset on every deploy or restart) and the service sleeps when idle.
    # For lasting data, use a paid plan, add a 1 GB disk mounted at /var/data
    # and set SYNERGY_DATA_FILE to /var/data/synergy.sqlite.
    plan: free
    region: singapore
    numInstances: 1
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: SYNERGY_DATA_FILE
        value: .data/synergy.sqlite
      - key: SYNERGY_DEMO_MODE
        value: "false"
      - key: SYNERGY_REQUIRE_VERIFICATION
        value: "true"
      # TEMPORARY for demos: shows "Simulate approval" on a pending
      # verification request, so anyone can verify themselves. Remove after.
      - key: SYNERGY_SIMULATE_VERIFICATION
        value: "true"
      - key: SYNERGY_ALLOWED_ORIGINS
        value: https://synergy-prototype.netlify.app
      - key: SYNERGY_ADMIN_EMAILS
        sync: false
      # Sign-in and mentorship email through Brevo. Render asks for the two
      # sync: false values when the Blueprint is created; EMAIL_FROM must be a
      # verified Brevo sender. Copy the generated webhook secret into the
      # Brevo webhook's bearer token (docs/operations/DEPLOYMENT.md).
      - key: EMAIL_PROVIDER
        value: brevo
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: BREVO_WEBHOOK_SECRET
        generateValue: true
      - key: SYNERGY_PUBLIC_URL
        value: https://synergy-prototype.netlify.app
