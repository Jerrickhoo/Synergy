services:
  - type: web
    name: synergy
    runtime: node
    plan: 0.5c-512mb
    region: singapore
    numInstances: 1
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: synergy-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: SYNERGY_DATA_FILE
        value: /var/data/synergy.sqlite
      - key: SYNERGY_DEMO_MODE
        value: "true"
      - key: SYNERGY_ADMIN_EMAILS
        sync: false
