services:
  - type: web
    name: synergy-prototype-api
    runtime: node
    # Paid plan with a persistent disk, so accounts and uploads survive
    # deploys, restarts and idle periods (the free plan has no disk and wiped
    # them). Needs a payment card on the Render account. Keep one instance:
    # SQLite allows a single writer.
    plan: starter
    region: singapore
    numInstances: 1
    disk:
      name: synergy-data
      mountPath: /var/data
      sizeGB: 1
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      # On the disk; uploads go to /var/data/uploads beside it.
      - key: SYNERGY_DATA_FILE
        value: /var/data/synergy.sqlite
      - key: SYNERGY_DEMO_MODE
        value: "false"
      - key: SYNERGY_REQUIRE_VERIFICATION
        value: "true"
      # TEMPORARY for demos: shows "Simulate approval" on a pending
      # verification request, so anyone can verify themselves. Remove after.
      - key: SYNERGY_SIMULATE_VERIFICATION
        value: "true"
      # Adds the fictional showcase mentors and startups at every start-up, so
      # Matches is populated even though the free plan starts from an empty
      # database. They share the public password in README.md.
      - key: SYNERGY_SHOWCASE_PROFILES
        value: "true"
      - key: SYNERGY_ALLOWED_ORIGINS
        value: https://synergy-prototype.netlify.app
      - key: SYNERGY_ADMIN_EMAILS
        sync: false
      # Sign-in and mentorship email through Brevo. Render asks for the two
      # sync: false values when the Blueprint is created; EMAIL_FROM must be a
      # verified Brevo sender. Copy the generated webhook secret into the
      # Brevo webhook's bearer token (docs/operations/DEPLOYMENT.md).
      - key: EMAIL_PROVIDER
        value: brevo
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: BREVO_WEBHOOK_SECRET
        generateValue: true
      - key: SYNERGY_PUBLIC_URL
        value: https://synergy-prototype.netlify.app
